# DEVONzot — fleet-monitor rules (owned by the DEVONzot team)
#
# WS7 (2026-07-08): DEVONzot's service moved from the iMac (launchd) to the Linux
# server (systemd user units). This ruleset was REWRITTEN for the server health model —
# the old iMac-shaped rules (gui_session_active, service_process_alive, seconds_since_sync)
# no longer apply and would fire false "sync stopped" warnings against the disabled iMac.
#
# The ross-server fleet monitor now reads a LOCAL snapshot the server emitter writes.
# Hand this block to the HA team to REPLACE the old `via: ssh host: iMac` devonzot block
# in /home/tradmin/ops/fleet_monitor/etc/fleet.yaml (remove the old one in the SAME change),
# then restart fleet-monitor.
#
# Emitter:  src/health_emitter_server.py         (fields it publishes)
# Units:    ops/devonzot-health.{service,timer}   (~60s tick)
# Watcher:  ops/devonzot.service (--zotdav-watch); its inotify loop stamps var/watch.beat
# Backstop: ops/devonzot-reconcile.timer (2h); advances state.last_reconcile
# See also: ~/.claude/plans/proceed-unified-hollerith.md (WS7 plan + cutover sequencing)
#
# Design notes:
#  - Everything is never-page (tier 2 digest / tier 3 info), matching HA's stance.
#  - Source is `via: file` (local read on the server — the emitter writes the snapshot
#    here, no ssh/port). NOTE: this host has no local sshd (`ssh localhost` -> connection
#    refused), so the via:ssh-localhost fallback is NOT available. `via: file` needs the
#    ~6-line handler in fleet_monitor.py app_probe (patch in the WS7 plan hand-off) —
#    merge this block and that handler together, or the block falls through to docker-exec.

devonzot:
  health:
    via: file
    path: /home/tradmin/DEVONzot/var/health.json
    # The health emitter ticks every 60s; >5m without a fresh snapshot == the emitter
    # timer itself stopped (i.e. reporting is down). Keep at 300.
    max_stale_s: 300

  rules:
    # ── real-time sync stopped (the authoritative server liveness signal) ──────
    # The watcher runs as systemd --user devonzot.service; the emitter reports its
    # `systemctl is-active` result. Replaces the iMac's gui/launchd-PID rules.
    - { field: service_active, equals: false, sustained_s: 300,
        severity: warning, tier: 2,
        reason: "DEVONzot: watcher (systemd devonzot.service) not active — real-time Zotero->DEVONthink sync stopped" }

    # ── DEVONthink unreachable (imports fail silently) ────────────────────────
    # On the server, MCP is the iMac's DEVONthink over TLS. No gui gate — there is no
    # GUI session on the server. The iMac is always-on, so unreachable == a real problem
    # (iMac down/asleep, DEVONthink not running, or Settings>AI>MCP HTTP server off).
    - { field: mcp_reachable, equals: false, sustained_s: 900,
        severity: warning, tier: 2,
        reason: "DEVONzot: iMac DEVONthink MCP unreachable from the server — blob migrations will fail" }

    - { field: status, not_equals: ok, sustained_s: 600,
        severity: warning, tier: 2,
        reason: "DEVONzot self-reports status != ok (app-level restart_count > 0)" }

    # ── watcher event loop wedged though the process is up ────────────────────
    # var/watch.beat is stamped every ~60s by the inotify loop itself (independent of
    # Zotero traffic — a quiet library still beats). >5m stale means the loop stopped
    # turning while the process is still alive — a stall `service_active` can't catch.
    - { field: seconds_since_watch_beat, above: 300, sustained_s: 120,
        severity: warning, tier: 3,
        reason: "DEVONzot: watcher inotify loop heartbeat stale >5m — event loop may be wedged" }

    # ── reconcile backstop not running ────────────────────────────────────────
    # The 2h reconcile timer advances state.last_reconcile. >3h absorbs the 2h interval
    # + AccuracySec + a slow run (up to the 30m TimeoutStartSec); beyond that the timer
    # or the reconcile itself has stopped.
    - { field: seconds_since_reconcile, above: 10800, sustained_s: 600,
        severity: warning, tier: 3,
        reason: "DEVONzot: reconcile backstop hasn't completed in >3h — devonzot-reconcile.timer may be stuck" }

    # ── stuck delete-retry queue (secondary) ──────────────────────────────────
    # Normal steady state is 0; items drop after retries, so a sustained backlog is
    # abnormal. 25 tolerates a legitimate migration burst. (pending_downloads is a
    # mac-only polling concept — not emitted on the server.)
    - { field: pending_deletes, above: 25, sustained_s: 3600,
        severity: warning, tier: 3,
        reason: "DEVONzot: delete retry queue > 25 for >1h — Zotero deletions not completing" }
